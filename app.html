<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA Law Email Drafter</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px 20px; 
            background: #f4f4f9; 
            color: #333; 
            margin: 0;
        }
        .box { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h2 { margin-top: 0; color: #1a365d; }
        textarea { 
            width: 100%; 
            height: 200px; 
            margin-bottom: 15px; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-family: inherit; 
            font-size: 14px; 
        }
        button { 
            background: #0056b3; 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: background 0.3s; 
        }
        button:hover { background: #004494; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        
        #output { 
            margin-top: 25px; 
            padding: 20px; 
            background: #f8fafc; 
            border-radius: 6px; 
            border: 1px solid #e2e8f0; 
            display: none; 
            width: 100%;
            overflow-x: hidden; 
        }
        
        /* THIS IS THE FIX FOR THE OVERLAPPING TEXT */
        #draftText { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            overflow-wrap: break-word; 
            font-family: inherit; 
            font-size: 15px; 
            line-height: 1.6; 
            color: #2d3748; 
            margin: 0; 
            width: 100%;
        }
        
        .audit-box { 
            margin-top: 20px; 
            padding: 15px; 
            background: #e6fffa; 
            border-left: 5px solid #38a169; 
            border-radius: 4px; 
        }
        .audit-box h4 { margin: 0 0 10px 0; color: #2f855a; }
        .audit-box p { margin: 5px 0; font-size: 14px; color: #2d3748; }
    </style>
</head>
<body>
    <div class="box">
        <h2>SA Law Email Drafter</h2>
        <p>Paste the incoming email below and attach any relevant documents.</p>
        
        <textarea id="emailText" placeholder="Paste the incoming email here..."></textarea>
        
        <div style="margin-bottom: 20px;">
            <input type="file" id="attachment" accept=".pdf,.doc,.docx">
        </div>
        
        <button onclick="draft()" id="btn">Draft Reply</button>

        <div id="output">
            <pre id="draftText"></pre>
            <div id="auditBox"></div>
        </div>
    </div>

    <script>
        async function draft() {
            const text = document.getElementById('emailText').value;
            const file = document.getElementById('attachment').files[0];
            const btn = document.getElementById('btn');
            const outputDiv = document.getElementById('output');
            const draftText = document.getElementById('draftText');
            const auditBox = document.getElementById('auditBox');

            if (!text) return alert("Please paste the email text first.");

            btn.innerText = "Drafting... (Please wait)";
            btn.disabled = true;
            outputDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('emailText', text);
            if (file) formData.append('attachment', file);

            try {
                // Render Backend URL
                const res = await fetch('https://legal-ai-backend-g6eb.onrender.com/api/agents/email-draft', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                // 1. Render the Draft
                draftText.innerText = data.draftReply || "No draft returned.";
                
                // 2. Render the Verity Audit
                let auditHTML = "";
                if (data.citations && (data.citations.cases.length > 0 || data.citations.acts.length > 0)) {
                    auditHTML += `<h4>✅ Verity Audit: SA Citations Detected</h4>`;
                    if (data.citations.cases.length > 0) {
                        auditHTML += `<p><strong>Case Law:</strong> ${data.citations.cases.join(', ')}</p>`;
                    }
                    if (data.citations.acts.length > 0) {
                        auditHTML += `<p><strong>Legislation:</strong> ${data.citations.acts.join(', ')}</p>`;
                    }
                    auditBox.className = "audit-box";
                    auditBox.innerHTML = auditHTML;
                } else {
                    auditBox.innerHTML = "";
                }

                outputDiv.style.display = 'block';
            } catch (e) {
                alert("Error: " + e.message + "\n\nRemember: The free server takes 50 seconds to wake up. Please try again and wait.");
            } finally {
                btn.innerText = "Draft Reply";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
