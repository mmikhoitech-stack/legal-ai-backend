<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA Law Email Drafter</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .box { background: white; max-width: 800px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        
        textarea { 
            width: 100%; 
            height: 150px; 
            padding: 10px; 
            box-sizing: border-box; 
            white-space: pre-wrap; 
            overflow-wrap: break-word; 
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 15px;
        }

        input[type="file"] { margin-bottom: 15px; display: block; }

        button { 
            background: #0056b3; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px;
        }
        button:hover { background: #004494; }

        #output { 
            margin-top: 20px; 
            padding: 15px; 
            background-color: #f9f9f9; 
            border-radius: 5px; 
            border: 1px solid #eee;
        }
        
        pre { 
            white-space: pre-wrap; 
            overflow-wrap: break-word; 
            word-wrap: break-word;
            font-family: monospace;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>SA Law Email Drafter</h2>
        
        <textarea id="emailText" placeholder="Paste the incoming email here..."></textarea>
        
        <input type="file" id="attachment" accept=".pdf, .doc, .docx">
        
        <button onclick="draft()" id="btn">Draft Reply</button>
        
        <div id="output" style="display: none;">
            <h3>Draft:</h3>
            <pre id="draftText"></pre>
        </div>
    </div>

    <script>
        async function draft() {
            const btn = document.getElementById('btn');
            const outputDiv = document.getElementById('output');
            const draftText = document.getElementById('draftText');
            const emailText = document.getElementById('emailText').value;
            const attachment = document.getElementById('attachment').files[0];

            if (!emailText && !attachment) {
                alert("Please paste an email or upload an attachment first.");
                return;
            }

            btn.innerText = "Drafting...";
            btn.disabled = true;
            outputDiv.style.display = 'none';

            const formData = new FormData();
            formData.append('emailText', emailText);
            if (attachment) {
                formData.append('attachment', attachment);
            }

            try {
                const res = await fetch('https://legal-ai-backend-66.onrender.com/api/agents/email-draft', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                draftText.innerText = data.draftReply || "No reply generated.";
                outputDiv.style.display = 'block';

            } catch (error) {
                console.error("Error:", error);
                alert("Failed to generate draft. Check console for details. Make sure your backend is running.");
            } finally {
                btn.innerText = "Draft Reply";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
