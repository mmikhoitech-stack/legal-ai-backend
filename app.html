<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Onus Probandi</title>
</head>
<body>
    <h2>Send Secure Email</h2>
    
    <input type="email" id="recipientEmail" placeholder="Recipient Email" value="mmikhoitech@gmail.com"><br><br>
    <input type="text" id="emailSubject" placeholder="Subject" value="Test Subject"><br><br>
    <textarea id="emailMessage" rows="5" placeholder="Message...">Hello, this is a test.</textarea><br><br>
    
    <button id="sendButton" onclick="sendSecureEmail()">Send secure email</button>
    <p id="status"></p>

    <script>
        async function sendSecureEmail() {
            const to = document.getElementById('recipientEmail').value;
            const subject = document.getElementById('emailSubject').value;
            const message = document.getElementById('emailMessage').value;
            const statusDiv = document.getElementById('status');
            const button = document.getElementById('sendButton');

            // 🚨 PUT YOUR RENDER URL HERE (e.g., https://legal-ai-backend.onrender.com)
            const RENDER_URL = 'https://YOUR_RENDER_URL.onrender.com'; 

            button.disabled = true;
            statusDiv.innerText = "Sending...";

            try {
                const response = await fetch(`${RENDER_URL}/api/secure-email/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to, subject, message })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "✅ Email sent successfully!";
                } else {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "❌ Error: Failed to send.";
                }
            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "❌ Network error. Backend is down.";
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
